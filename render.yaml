databases:
  - name: augenfacharzt-db
    databaseName: augenfacharzt
    user: augenfacharzt
    plan: free
    region: frankfurt

services:
  - type: web
    name: augenfacharzt
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: augenfacharzt-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ADMIN_SEED_USERNAME
        value: admin
      - key: ADMIN_SEED_PASSWORD
        value: ChangeMe123!
